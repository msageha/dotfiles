# CLAUDE.md and the appended-system-prompt docs (CLAUDE-*.md) are verbatim;
# keep formatters and typos from rewriting them.
exclude: ^home/dot_claude/CLAUDE.*\.md$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # chezmoi の modify-template / includeTemplate 対象は Go テンプレート構文を
        # 含み JSON として不正なため除外する
        exclude: ^home/(\.chezmoitemplates/|modify_)
      - id: check-toml
        exclude: ^home/((dot_codex|dot_grok)/modify_private_config\.toml|\.chezmoiexternal\.toml|\.chezmoitemplates/)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        exclude: \.zsh$
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint
        args:
          [
            --ignore,
            DL3008,
            --ignore,
            DL3015,
            --ignore,
            DL3018,
            --ignore,
            DL3004,
          ]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa # frozen: v1.29.0
    hooks:
      - id: zizmor
  - repo: local
    hooks:
      - id: dprint-fmt
        name: Format json/yaml/markdown/toml with dprint
        language: system
        entry: mise exec -- dprint fmt --allow-no-files
        types_or: [json, yaml, markdown, toml]
      - id: psscriptanalyzer
        name: Lint PowerShell scripts with PSScriptAnalyzer
        language: system
        entry: mise exec -- pwsh -NoProfile -CommandWithArgs 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }; $findings = @($args | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost, PSUseBOMForUnicodeEncodedFile, PSUseShouldProcessForStateChangingFunctions, PSUseSingularNouns }); if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }'
        require_serial: true
        types: [powershell]
  - repo: https://github.com/crate-ci/typos
    rev: 8a48f81b6c64dcfea44b3633223084c4be58ac5f # frozen: v1.49.0
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint-system
