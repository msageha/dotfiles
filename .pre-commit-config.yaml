# Claude Code にそのまま渡すファイルなので formatter に書き換えさせない
exclude: ^home/dot_claude/CLAUDE\.md$
# stages を指定しない hook は既定で全 stage (push 時を含む) で走るので、commit 時に限る
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # Go テンプレート構文を含み JSON として不正なため除外する
        exclude: ^home/(\.chezmoitemplates/|modify_)
      - id: check-toml
        exclude: ^home/((dot_codex|dot_grok)/modify_private_config\.toml|\.chezmoiexternal\.toml|\.chezmoitemplates/)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint
        args: [--ignore, DL3008, --ignore, DL3018]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
  - repo: local
    hooks:
      - id: dprint-fmt
        name: Format json/yaml/markdown/toml with dprint
        language: system
        # prek はファイルをバッチに分けて dprint を並列に起動する。全ファイルが dprint.json の excludes に
        # 当たるバッチは、--allow-no-files が無いと exit 14 で非決定的に失敗する
        entry: mise exec -- dprint fmt --allow-no-files
        types_or: [json, yaml, markdown, toml]
      - id: psscriptanalyzer
        name: Lint PowerShell scripts with PSScriptAnalyzer
        language: system
        entry: mise exec -- pwsh -NoProfile -CommandWithArgs 'if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }; $findings = @($args | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost, PSUseBOMForUnicodeEncodedFile, PSUseShouldProcessForStateChangingFunctions, PSUseSingularNouns }); if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }'
        require_serial: true
        types: [powershell]
      - id: chezmoi-dry-run
        name: Render every chezmoi template (chezmoi apply --dry-run --force)
        language: system
        # 既定の source (~/.local/share/chezmoi) ではなく、push しようとしている checkout を描画する
        entry: mise exec -- chezmoi apply --dry-run --force --source .
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: bats-install
        name: Run bats tests for install scripts and Docker variants
        language: system
        entry: mise exec -- bats -r tests/install tests/docker
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/crate-ci/typos
    rev: 4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # frozen: v1.52.0
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint-system
