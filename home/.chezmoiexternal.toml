# dracula テーマ群は commit SHA で固定する
# archive 型で pin し、更新は renovate で追従させる。
[".vim/pack/themes/start/dracula"]
type = "archive"
url = "https://github.com/dracula/vim/archive/4f068752154e70ef8e03d6a70992033fff20a165.tar.gz"
exact = true
stripComponents = 1

[".config/delta/dracula"]
type = "archive"
url = "https://github.com/dracula/delta/archive/3e0b3ca3d1bb893c08949167893e3d2ac8b7bcc5.tar.gz"
exact = true
stripComponents = 1

[".tmux/plugins/dracula"]
type = "archive"
url = "https://github.com/dracula/tmux/archive/a4612670d77c8546690dc79d23eae591c6dfa8d3.tar.gz"
exact = true
stripComponents = 1

[".config/dircolors/dracula"]
type = "archive"
url = "https://github.com/dracula/dircolors/archive/4b80eae10819becb1ba285aecd81487540b14b44.tar.gz"
exact = true
stripComponents = 1

{{ if and (ne .chezmoi.os "windows") (not (dig "skip_cli_tools" false .)) }}
[".local/bin/git-open"]
type = "file"
url = "https://raw.githubusercontent.com/paulirish/git-open/63c0e77aaf18b72c839b1113c1e2f9514413643b/git-open"
executable = true
{{ end }}

{{ if and (ne .chezmoi.os "windows") (not (dig "skip_gui_tools" false .)) }}
{{- /* カスタムテーマの探索パスは ~/.config/ghostty/themes と Ghostty resources dir のみ
      (+show-config --docs で確認)。macOS も XDG 側に置く (旧 AppSupport 配置は探索対象外) */}}
[".config/ghostty/themes/dracula"]
type = "file"
url = "https://raw.githubusercontent.com/dracula/ghostty/b0e64590232331d9837c82cc1c5138e11ea39f76/dracula"
{{ end }}

{{ if and (eq .chezmoi.os "darwin") (not (dig "skip_gui_tools" false .)) }}
["Library/Developer/Xcode/UserData/FontAndColorThemes/Dracula.xccolortheme"]
type = "file"
url = "https://raw.githubusercontent.com/dracula/xcode/fa045e9b1a47d348e8938ad6f14d3ee8a3b40788/Dracula.xccolortheme"

["Library/Developer/Xcode/UserData/FontAndColorThemes/Alucard.xccolortheme"]
type = "file"
url = "https://raw.githubusercontent.com/dracula/xcode/fa045e9b1a47d348e8938ad6f14d3ee8a3b40788/Alucard.xccolortheme"
{{ end }}

# フォント群は .chezmoitemplates/external-fonts.toml で定義する
{{ includeTemplate "external-fonts.toml" . }}
