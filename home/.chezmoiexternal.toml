# dracula テーマ群は commit SHA で固定する
# archive 型で pin し、更新は renovate で追従させる。
[".vim/pack/themes/start/dracula"]
type = "archive"
url = "https://github.com/dracula/vim/archive/4f068752154e70ef8e03d6a70992033fff20a165.tar.gz"
exact = true
stripComponents = 1

[".config/delta/dracula"]
type = "archive"
url = "https://github.com/dracula/delta/archive/3e0b3ca3d1bb893c08949167893e3d2ac8b7bcc5.tar.gz"
exact = true
stripComponents = 1

[".tmux/plugins/dracula"]
type = "archive"
url = "https://github.com/dracula/tmux/archive/a4612670d77c8546690dc79d23eae591c6dfa8d3.tar.gz"
exact = true
stripComponents = 1

[".config/dircolors/dracula"]
type = "archive"
url = "https://github.com/dracula/dircolors/archive/4b80eae10819becb1ba285aecd81487540b14b44.tar.gz"
exact = true
stripComponents = 1

{{ if and (ne .chezmoi.os "windows") (not (dig "skip_cli_tools" false .)) }}
[".local/bin/git-open"]
type = "file"
url = "https://raw.githubusercontent.com/paulirish/git-open/63c0e77aaf18b72c839b1113c1e2f9514413643b/git-open"
executable = true
{{ end }}

{{ if and (ne .chezmoi.os "windows") (not (dig "skip_gui_tools" false .)) }}
{{ $ghosttyDir := ".config/ghostty" }}
{{- if eq .chezmoi.os "darwin" }}{{ $ghosttyDir = "Library/Application Support/com.mitchellh.ghostty" }}{{ end }}
["{{ $ghosttyDir }}/themes/dracula"]
type = "file"
url = "https://raw.githubusercontent.com/dracula/ghostty/b0e64590232331d9837c82cc1c5138e11ea39f76/dracula"
{{ end }}

{{ if and (eq .chezmoi.os "darwin") (not (dig "skip_gui_tools" false .)) }}
["Library/Developer/Xcode/UserData/FontAndColorThemes/Dracula.xccolortheme"]
type = "file"
url = "https://raw.githubusercontent.com/dracula/xcode/fa045e9b1a47d348e8938ad6f14d3ee8a3b40788/Dracula.xccolortheme"

["Library/Developer/Xcode/UserData/FontAndColorThemes/Alucard.xccolortheme"]
type = "file"
url = "https://raw.githubusercontent.com/dracula/xcode/fa045e9b1a47d348e8938ad6f14d3ee8a3b40788/Alucard.xccolortheme"
{{ end }}

# フォント群も pin + renovate 追従の archive external で導入する (旧 install/common/fonts.sh)。
# フォントの描画はクライアント側 (端末エミュレータ) で行われるため、
# ヘッドレス環境 (skip_gui_tools=true) では導入しない。Windows は
# install/windows/setup_powershell.ps1 が別途 Nerd Font を導入する。
# 導入元ごとのサブディレクトリへ exact = true で展開することで、版 bump 時に
# 旧ファイルを残さず、かつ手動導入した他のフォントと共存できる
# (macOS の CoreText / Linux の fontconfig はフォントディレクトリを再帰走査する)。
# Linux は更新後に fc-cache の再実行が要るため run_onchange_after_93_fonts.sh.tmpl が発火する。
{{ if and (ne .chezmoi.os "windows") (not (dig "skip_gui_tools" false .)) }}
{{ $fontDir := ".local/share/fonts" }}
{{- if eq .chezmoi.os "darwin" }}{{ $fontDir = "Library/Fonts" }}{{ end }}
# upstream の install.sh 相当 (フォントファイルのみコピー、install スクリプト等は除外)。
# include はアーカイブ内のディレクトリエントリも除外してしまい、階層を保ったまま
# 展開すると中間ディレクトリが作られず apply が失敗するため、stripComponents = 2 で
# ファミリーディレクトリを剥がしてフラットに展開する (ファイル名は全ファミリーで一意)。
# 深さ固定の include パターンにより、upstream が別階層にファイルを足しても
# 取りこぼすだけで apply は壊れない。
["{{ $fontDir }}/powerline-fonts"]
type = "archive"
url = "https://github.com/powerline/fonts/archive/a029626780dd4af32f15a3e708a5b00528c22f1d.tar.gz"
exact = true
stripComponents = 2
include = ["*/*/*.ttf", "*/*/*.otf"]

{{ if eq .chezmoi.os "linux" }}
# Terminus (ビットマップフォント) のみ深さが違う (*/Terminus/PCF/*.pcf.gz)。
# PCF は fontconfig (Linux) 専用で macOS の CoreText は扱えないため Linux 限定。
["{{ $fontDir }}/powerline-fonts-terminus-pcf"]
type = "archive"
url = "https://github.com/powerline/fonts/archive/a029626780dd4af32f15a3e708a5b00528c22f1d.tar.gz"
exact = true
stripComponents = 3
include = ["*/Terminus/PCF/*.pcf.gz"]
{{ end }}

["{{ $fontDir }}/sauce-code-pro-nerd-font"]
type = "archive"
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/SourceCodePro.zip"
exact = true
include = ["*.ttf"]

["{{ $fontDir }}/nerd-fonts-symbols"]
type = "archive"
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/NerdFontsSymbolsOnly.zip"
exact = true
include = ["*.ttf"]

["{{ $fontDir }}/source-han-code-jp"]
type = "archive"
url = "https://github.com/adobe-fonts/source-han-code-jp/archive/refs/tags/2.012R.zip"
exact = true
stripComponents = 2
include = ["*/OTF/*.otf"]
{{ end }}
