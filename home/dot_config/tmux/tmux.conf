setw -g mode-keys vi

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

set -g mouse on

# 端末のウィンドウタイトルを #T (pane_title。シェルやアプリが OSC で設定する題名) に追従させる
set -g set-titles on
set -g set-titles-string '#T'

# スクロールバックバッファを既定 2000 から拡張
set -g history-limit 50000

# -------------------------------
# Dracula Theme (https://github.com/dracula/tmux)
# -------------------------------
# プラグイン本体は .chezmoiexternal.toml が ~/.local/share/tmux/plugins/dracula に取得する (tpm 不使用)。
# @dracula-plugins 未指定時のデフォルトは battery/network/weather で、外部コマンドや
# ネットワークアクセスに依存するため、依存の無い最小セットを明示する
set -g @dracula-plugins "git time"
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
# 初回 apply 直後など external 未取得時は存在確認してから読み込み、エラー出力を避ける
if-shell "test -f ~/.local/share/tmux/plugins/dracula/dracula.tmux" "run-shell ~/.local/share/tmux/plugins/dracula/dracula.tmux"
