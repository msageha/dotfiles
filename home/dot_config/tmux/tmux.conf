setw -g mode-keys vi

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

set -g mouse on

# 端末のタイトルを #T (シェルやアプリが OSC で設定する pane_title) に追従させる
set -g set-titles on
set -g set-titles-string '#T'

set -g history-limit 50000

# Dracula テーマ (https://github.com/dracula/tmux)。本体は tpm を使わず .chezmoiexternal.toml が取得する。
# 既定の plugin (battery / network / weather) は外部コマンドやネットワークに依存するため、依存の無いものに絞る
set -g @dracula-plugins "git time"
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
# external の取得前 (初回 apply 直後等) でもエラーを出さないよう、存在を確かめてから読む
if-shell "test -f ~/.local/share/tmux/plugins/dracula/dracula.tmux" "run-shell ~/.local/share/tmux/plugins/dracula/dracula.tmux"
