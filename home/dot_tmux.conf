# -------------------------------
# Vim Shortcuts
# -------------------------------
setw -g mode-keys vi

# -------------------------------
# Reload Configuration
# -------------------------------
# `Ctrl+A R`で設定ファイルをリロード
# unbind r
# bind r source-file ~/.tmux.conf

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

set -g mouse on

# 端末のウィンドウタイトルをカレントコマンド名で更新する設定
set -g set-titles on
set -g set-titles-string '#T'

# -------------------------------
# History
# -------------------------------
# スクロールバックバッファのサイズを制限（メモリ使用量の抑制）
set -g history-limit 50000

# -------------------------------
# Dracula Theme (https://github.com/dracula/tmux)
# -------------------------------
# プラグイン本体は .chezmoiexternal.toml が ~/.tmux/plugins/dracula に取得する (tpm 不使用)。
# @dracula-plugins 未指定時のデフォルトは battery/network/weather で、外部コマンドや
# ネットワークアクセスに依存するため、依存の無い最小セットを明示する
set -g @dracula-plugins "git time"
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
# 初回 apply 直後など external 未取得時は存在確認してから読み込み、エラー出力を避ける
if-shell "test -f ~/.tmux/plugins/dracula/dracula.tmux" "run-shell ~/.tmux/plugins/dracula/dracula.tmux"
