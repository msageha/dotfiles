# codex --profile <name> が読む profile-v2 overlay (~/.codex/<name>.config.toml)。
# standalone ではなく base の config.toml に再帰マージされるため、ここには上書きしたい
# キーだけを書く (model_provider が参照する [model_providers.*] は base 側の定義が効く)。
model = "fugu-cyber"
model_reasoning_effort = "high"
model_provider = "fugu_cyber"
model_catalog_json = "~/.codex/fugu-cyber.json"

[features]
image_generation = false

[analytics]
enabled = false

[otel]
metrics_exporter = "none"
