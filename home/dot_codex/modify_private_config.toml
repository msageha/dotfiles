{{- /* chezmoi:modify-template */ -}}
{{- /*
  ~/.codex/config.toml の既存値に、下の desired の key だけを上書きする (projects・tui 等の Codex のローカル状態は温存する)。
  approval_policy = "never" と workspace-write の組み合わせでは、~/.codex/rules/ の allow に一致するコマンドだけが sandbox の外で動き、
  ほかに sandbox の外が要るコマンドは確認なしで失敗する。
  analytics / otel.metrics_exporter は外部送信を止める (otel のログ・トレースは既定で none)。
  OpenAI API key がある環境では、chezmoi が管理する ~/.codex/auth.json を読ませるため cli_auth_credentials_store = "file" にする
  (keyring / auto では読まれない)。
*/ -}}
{{- $worksSrc := joinPath .chezmoi.homeDir "Works" "src" -}}
{{- $chezmoiSrc := joinPath .chezmoi.homeDir ".local" "share" "chezmoi" -}}
{{- /* Codex は trust の照合でパス区切りを正規化しないため、Windows では \ 区切りで書く */ -}}
{{- if eq .chezmoi.os "windows" -}}
{{-   $worksSrc = replace "/" "\\" $worksSrc -}}
{{-   $chezmoiSrc = replace "/" "\\" $chezmoiSrc -}}
{{- end -}}
{{- $desired := printf `
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
approval_policy = "never"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]

[sandbox_workspace_write]
network_access = true

[agents]
max_concurrent_threads_per_session = 6

[analytics]
enabled = false

[otel]
metrics_exporter = "none"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@%s"]
startup_timeout_ms = 20_000

[model_providers.sakana]
name = "Sakana API"
base_url = "https://api.torafugu.app/v1"
env_key = "SAKANA_API_KEY"
wire_api = "responses"
stream_idle_timeout_ms = 600000

[model_providers.fugu_cyber]
name = "Sakana API (Cyber PAYG)"
base_url = "https://api.torafugu.app/v1"
env_key = "FUGU_PAYG_API_KEY"
wire_api = "responses"
stream_idle_timeout_ms = 600000

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"
stream_idle_timeout_ms = 600000

[projects.%q]
trust_level = "trusted"

[projects.%q]
trust_level = "trusted"
` .mcp.context7 $worksSrc $chezmoiSrc | fromToml -}}
{{- /* AI_AGENT は agent からの実行を示す共通の marker で、dot_config/shell/env.sh 等もこれで agent の shell を判定する */ -}}
{{- $desired = mergeOverwrite $desired (dict "shell_environment_policy" (dict "set" (merge (dict "AI_AGENT" "1") .agent_env))) -}}
{{- /* Windows の PATH には false / cat が無いため editor と pager を PowerShell で代替する。Git for Windows は起動時に同梱の usr\bin を
      PATH に足し、git / gh は pager の cat を「pager なし」として扱うため、GIT_* と GH_PAGER は共通値のままでよい */ -}}
{{- if eq .chezmoi.os "windows" -}}
{{-   $desired = mergeOverwrite $desired (fromToml `
[shell_environment_policy.set]
EDITOR = "powershell.exe -NoProfile -NonInteractive -Command exit 1"
VISUAL = "powershell.exe -NoProfile -NonInteractive -Command exit 1"
PAGER = 'powershell.exe -NoProfile -NonInteractive -Command "[Console]::OpenStandardInput().CopyTo([Console]::OpenStandardOutput())"'
MANPAGER = 'powershell.exe -NoProfile -NonInteractive -Command "[Console]::OpenStandardInput().CopyTo([Console]::OpenStandardOutput())"'
AWS_PAGER = 'powershell.exe -NoProfile -NonInteractive -Command "[Console]::OpenStandardInput().CopyTo([Console]::OpenStandardOutput())"'
`) -}}
{{- end -}}
{{- /* xcrun は macOS 専用で、dart も flutter とともに macOS にだけ導入する (mise config) */}}
{{- if eq .chezmoi.os "darwin" -}}
{{-   $desired = mergeOverwrite $desired (fromToml `
[mcp_servers.dart]
command = "dart"
args = ["mcp-server"]
startup_timeout_ms = 20_000

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
startup_timeout_ms = 20_000
`) -}}
{{- end -}}
{{- if dig "apiKeys" "openai" "" . -}}
{{-   $desired = mergeOverwrite $desired (fromToml `
cli_auth_credentials_store = "file"
`) -}}
{{- end -}}
{{- $current := dict -}}
{{- $stdin := trim (dig "stdin" "" .chezmoi) -}}
{{- if $stdin -}}
{{-   $current = fromToml $stdin -}}
{{- end -}}
{{- /* AGENTS.md は user role で注入され、base prompt (developer role) の既定動作 (質問形を実行指示とみなす・worktree や
      draft PR を自律的に作る等) を上書きできない。衝突する少数の契約だけを developer_instructions に置く */ -}}
{{- $_ := set $desired "developer_instructions" (includeTemplate "codex/developer-instructions.md" . | trim) -}}
{{- /* playwright / chrome-devtools は Codex に置かず、適用先に残るエントリも消す。Codex は custom agent の mcp_servers を無視し、
      main に置くと codex exec の起動のたびに MCP が立ち上がるため */ -}}
{{- if hasKey $current "mcp_servers" -}}
{{-   $_ := unset (get $current "mcp_servers") "playwright" -}}
{{-   $_ := unset (get $current "mcp_servers") "chrome-devtools" -}}
{{- end -}}
{{- if and (ne .chezmoi.os "darwin") (hasKey $current "mcp_servers") -}}
{{-   $_ := unset (get $current "mcp_servers") "dart" -}}
{{-   $_ := unset (get $current "mcp_servers") "xcode" -}}
{{- end -}}
{{- /* この template が以前書いていて、今は効果が無いか改名された key を適用先から消す */ -}}
{{- $_ := unset $current "personality" -}}
{{- $_ := unset $current "approvals_reviewer" -}}
{{- if hasKey $current "agents" -}}
{{-   $_ := unset (get $current "agents") "max_threads" -}}
{{-   $_ := unset (get $current "agents") "max_depth" -}}
{{- end -}}
{{- if hasKey $current "notice" -}}
{{-   $_ := unset (get $current "notice") "hide_gpt-5.1-codex-max_migration_prompt" -}}
{{- end -}}
{{- /* macOS の ls は CLICOLOR の値でなく有無で色を付けるため、人間の shell から継承した値を外す。既存の exclude は残す */ -}}
{{- $_ := set (get $desired "shell_environment_policy") "exclude" (concat (dig "shell_environment_policy" "exclude" (list) $current) (list "CLICOLOR") | uniq) -}}
{{- /* shell_environment_policy.set は全量を管理し、desired から外した key が適用済みの config に残らないよう置き換える */ -}}
{{- if hasKey $current "shell_environment_policy" -}}
{{-   $_ := unset (get $current "shell_environment_policy") "set" -}}
{{- end -}}
{{- mergeOverwrite $current $desired | toToml -}}
