# GitHub ユーザー名 (dot_config/gh/private_hosts.yml.tmpl が読む)
[github]
user = "msageha"

# コーディングエージェント設定が参照する MCP server のバージョン pin (renovate が annotation で追従)
[mcp]
# renovate: datasource=npm depName=@upstash/context7-mcp
context7 = "4.5.1"
# renovate: datasource=npm depName=chrome-devtools-mcp
chromeDevtools = "1.12.0"
# renovate: datasource=npm depName=@playwright/mcp
playwright = "0.0.84"
# renovate: datasource=npm depName=@ask-llm/antigravity-mcp
antigravity = "0.8.1"
# renovate: datasource=npm depName=@drawio/mcp
drawio = "1.11.0"
# renovate: datasource=github-releases depName=gemini-cli-extensions/nanobanana
nanobanana = "v1.0.12"

# Claude Code の plugin marketplace (name = GitHub repo) と plugin (id = 既定で有効にするか)。
# install/common/claude_plugins.sh (Windows は claude_plugins.ps1) が marketplace を登録して有効な plugin だけ導入し、
# dot_claude/private_settings.json.tmpl が extraKnownMarketplaces / enabledPlugins を描画する
[claude.marketplaces]
claude-plugins-official = "anthropics/claude-plugins-official"
openai-codex = "openai/codex-plugin-cc"

[claude.plugins]
"agent-sdk-dev@claude-plugins-official" = false
"clangd-lsp@claude-plugins-official" = false
"claude-md-management@claude-plugins-official" = true
"cloudflare@claude-plugins-official" = false
"codex@openai-codex" = true
"github@claude-plugins-official" = true
"gopls-lsp@claude-plugins-official" = true
"plugin-dev@claude-plugins-official" = false
"pyright-lsp@claude-plugins-official" = true
"skill-creator@claude-plugins-official" = true
"sonatype-guide@claude-plugins-official" = true
"swift-lsp@claude-plugins-official" = true
"typescript-lsp@claude-plugins-official" = true

# サブエージェントの description。本文は .chezmoitemplates/agents/<name>.md、
# Claude / Codex / Gemini の各 wrapper template が .agents.<name> で読む (キーは underscore。無いキーは描画時に fail する)
[agents]
browser_debugger = "Verifies frontend changes in a real browser and investigates console, network, and performance issues through the Playwright and Chrome DevTools MCP servers. Delegate to it so that snapshots, console logs, and traces stay out of the caller's context."
code_reviewer = "Code reviewer that reports findings and leaves fixes to the caller. Use when the user asks for a code review, or to check your own changes in an independent context mid-task. For the other-model review that AGENTS.md requires, use that model's CLI; use this agent for it only when no other model is available."
debugger = "Finds the root cause of a concrete failure (failing test, runtime error, CI failure). It fixes the cause only when the delegation prompt asks for a fix; otherwise it stays read-only and returns the cause with evidence and a proposed fix."
security_reviewer = "Security reviewer that reports vulnerabilities and leaves fixes to the caller. Use for changes to authentication, authorization, secrets, dependencies, infrastructure, input handling, dangerous commands, LLM integration (prompts, tool permissions, model output handling), or CI / supply chain."
source_grounded_researcher = "Researcher that checks claims about library, SDK, CLI, or service behavior against primary sources (official docs, GitHub repositories including private ones, the web) and cites each finding by URL or file:line. For local code exploration alone, use the tool's built-in exploration agent."
test_runner = "Runs tests, lint, and verification commands, then summarizes failures by root cause. Use when the output should stay out of the caller's context and no fix is needed."

# Codex の custom agent (dot_codex/agents/*.toml.tmpl) が共通で使うモデル。reasoning effort は役割ごとに各ファイルが持つ。
# .chezmoitemplates/codex/instructions.md もこの値を main agent への説明に描画する
[codex]
subagent_model = "gpt-6.1-sol"

# Agent の shell の環境変数 (docs/agent-shell.md)。editor の自動起動を失敗終了にし、pager と各 CLI の対話 prompt を止める。
# GIT_EDITOR は Claude Code の既定と同じ true にして、rebase --continue 等が既定のメッセージで進むようにする。
# dot_config/shell/agent-env.sh.tmpl (bash / zsh と Claude Code の SessionStart hook)、dot_config/fish/agent-env.fish.tmpl、
# dot_codex/modify_private_config.toml の shell_environment_policy.set が読む。PowerShell は値が異なるため install/windows/setup_powershell.ps1 が別に持つ
[agent_env]
EDITOR = "false"
VISUAL = "false"
GIT_EDITOR = "true"
GIT_SEQUENCE_EDITOR = "false"
PAGER = "cat"
GIT_PAGER = "cat"
GH_PAGER = "cat"
MANPAGER = "cat"
NO_COLOR = "1"
GIT_TERMINAL_PROMPT = "0"
GH_PROMPT_DISABLED = "1"
AWS_PAGER = ""
AWS_CLI_AUTO_PROMPT = "off"

# 1Password から chezmoi apply 時に取得する SSH 鍵 (README「SSH 秘密鍵」)。
# path は ~/.ssh からの相対 target path。source の private_dot_ssh/private_<dir>/private_<name>.tmpl (秘密鍵) と
# private_<dir>/<name>.pub.tmpl (公開鍵) の位置と手で一致させる (ズレると .chezmoiignore の除外が外れ、通常の status / apply で op read が走る)。
# item は vault 内の SSH Key item 名。各 template は .ssh_keys.items.<key>.item で参照する (無いキーは描画時に fail する)
[ssh_keys]
# vault は ID で指定する (名前 "[Dev] SSH Keys" の "[" は op:// の secret reference で使えない)
vault = "gbprko7eo2rpxq2jgtdq3hxmly"

[ssh_keys.items]
git_msageha = { path = "git_msageha", item = "ssh-git_msageha" }
mzk_macos = { path = "mzk/macos", item = "ssh-mzk-macos" }
mzk_openclaw = { path = "mzk/openclaw", item = "ssh-mzk-openclaw" }
mzk_proxmox = { path = "mzk/proxmox", item = "ssh-mzk-proxmox" }
parents_freshtomato = { path = "parents/freshtomato", item = "ssh-parents-freshtomato" }
parents_proxmox = { path = "parents/proxmox", item = "ssh-parents-proxmox" }
technoface_gitlab = { path = "technoface/gitlab", item = "ssh-technoface-gitlab" }
technoface_server = { path = "technoface/server", item = "ssh-technoface-server" }
