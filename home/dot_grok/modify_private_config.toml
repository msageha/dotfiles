{{- /* chezmoi:modify-template */ -}}
{{- $desired := printf `
[cli]
auto_update = false

[features]
# support_permission は undocumented (docs.x.ai の settings reference に記載なし) だが、
# バイナリ埋め込み README では「prompt before tool execution」と説明されている。
# false はツール実行前プロンプトの無効化 (全 auto-approve 相当) の可能性が高いため、
# ガードを残す安全側の true にする。挙動は --permission-mode / --always-approve で都度緩められる。
support_permission = true
telemetry = false
feedback = false

[telemetry]
trace_upload = false

[subagents]
enabled = true

[compat.claude]
rules = true
agents = true
mcps = false
skills = false
hooks = false

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@%s"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@%s"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@%s"]
` .mcp.context7 .mcp.chromeDevtools .mcp.playwright | fromToml -}}
{{- /* dart (flutter 同梱) は mise が darwin + skip_cli_tools=false でのみ導入し、この config 自体が
      skip_cli_tools=false のときだけ管理されるため、darwin 固定で決定的になる
      (lookPath は apply 時の PATH に依存して結果が揺れるため使わない) */ -}}
{{- if eq .chezmoi.os "darwin" -}}
{{-   $desired = mergeOverwrite $desired (fromToml `
[mcp_servers.dart]
command = "dart"
args = ["mcp-server"]

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
`) -}}
{{- end -}}
{{- $current := dict -}}
{{- $stdin := "" -}}
{{- if hasKey .chezmoi "stdin" -}}
{{-   $stdin = trim .chezmoi.stdin -}}
{{- end -}}
{{- if $stdin -}}
{{-   $current = fromToml $stdin -}}
{{- end -}}
{{- /* 旧 lookPath ガード時代に darwin 以外で登録された dart / xcode の stale エントリを掃除する
      (mergeOverwrite は desired に無いキーを削除しないため明示的に unset する) */ -}}
{{- if and (ne .chezmoi.os "darwin") (hasKey $current "mcp_servers") -}}
{{-   $_ := unset (get $current "mcp_servers") "dart" -}}
{{-   $_ := unset (get $current "mcp_servers") "xcode" -}}
{{- end -}}
{{- mergeOverwrite $current $desired | toToml -}}
