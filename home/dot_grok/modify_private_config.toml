{{- /* chezmoi:modify-template */ -}}
{{- $desired := printf `
[cli]
auto_update = false

[features]
# support_permission は undocumented (docs.x.ai の settings reference に記載なし) だが、
# バイナリ埋め込み README では「prompt before tool execution」と説明されている。
# 自律実行を優先し、ツール実行前プロンプトを無効化 (全 auto-approve 相当) する false にする。
# ガードを戻したい場合は true + --permission-mode で都度制御する。
support_permission = false
telemetry = false
feedback = false

[telemetry]
trace_upload = false

[subagents]
enabled = true

[compat.claude]
rules = true
agents = true
mcps = false
skills = false
hooks = false

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@%s"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@%s"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@%s"]
` .mcp.context7 .mcp.chromeDevtools .mcp.playwright | fromToml -}}
{{- /* dart (flutter 同梱) は macOS + skip_cli_tools=false でのみ導入する。 */}}
{{- if eq .chezmoi.os "darwin" -}}
{{-   $desired = mergeOverwrite $desired (fromToml `
[mcp_servers.dart]
command = "dart"
args = ["mcp-server"]

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
`) -}}
{{- end -}}
{{- $current := dict -}}
{{- $stdin := "" -}}
{{- if hasKey .chezmoi "stdin" -}}
{{-   $stdin = trim .chezmoi.stdin -}}
{{- end -}}
{{- if $stdin -}}
{{-   $current = fromToml $stdin -}}
{{- end -}}
{{- if and (ne .chezmoi.os "darwin") (hasKey $current "mcp_servers") -}}
{{-   $_ := unset (get $current "mcp_servers") "dart" -}}
{{-   $_ := unset (get $current "mcp_servers") "xcode" -}}
{{- end -}}
{{- mergeOverwrite $current $desired | toToml -}}
