{{- /* chezmoi:modify-template */ -}}
{{- $desired := printf `
[cli]
auto_update = false

[features]
# support_permission は undocumented だが、バイナリ同梱の README では「prompt before tool execution」。
# 自律実行を優先して false (ツール実行前に確認しない) にする
support_permission = false
telemetry = false
feedback = false

[telemetry]
trace_upload = false

[subagents]
enabled = true

[compat.claude]
# rules は paths を無視して ~/.claude/rules と project の .claude/rules を全件常時読み込むため止め、
# 共通 AGENTS.md のとおり対象に当たる rule だけを読ませる
rules = false
# agents は ~/.claude/CLAUDE.md (Claude Code 用の補足) と project の .claude/CLAUDE*.md を読み込むため止める
# (project 直下の CLAUDE.md と ~/.claude/agents は false でも読まれる)
agents = false
mcps = false
# false だと ~/.claude/skills は無効になり ~/.agents/skills しか使えない。true は Claude plugin の skill・command も読み込む
skills = true
hooks = false

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@%s"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@%s"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@%s"]
` .mcp.context7 .mcp.chromeDevtools .mcp.playwright | fromToml -}}
{{- /* dart / xcode MCP は macOS 専用バイナリ (dart, xcrun) に依存する */}}
{{- if eq .chezmoi.os "darwin" -}}
{{-   $desired = mergeOverwrite $desired (fromToml `
[mcp_servers.dart]
command = "dart"
args = ["mcp-server"]

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
`) -}}
{{- end -}}
{{- $current := dict -}}
{{- $stdin := trim (dig "stdin" "" .chezmoi) -}}
{{- if $stdin -}}
{{-   $current = fromToml $stdin -}}
{{- end -}}
{{- if and (ne .chezmoi.os "darwin") (hasKey $current "mcp_servers") -}}
{{-   $_ := unset (get $current "mcp_servers") "dart" -}}
{{-   $_ := unset (get $current "mcp_servers") "xcode" -}}
{{- end -}}
{{- mergeOverwrite $current $desired | toToml -}}
