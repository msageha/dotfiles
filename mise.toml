[tools]
actionlint = "1.7.12"
age = "1.3.2"
bats = "1.14.0"
chezmoi = "2.72.0"
dprint = "0.56.1"
fnox = "1.34.1"
hadolint = "2.15.1"
op = "2.34.1"
powershell = "7.6.5"
prek = "0.5.0"
shellcheck = "0.11.0"

[hooks]
postinstall = "prek install"

[settings]
lockfile = true

[tasks.apply]
description = "chezmoi apply --verbose (実際に適用)"
run = "chezmoi apply --verbose"

[tasks.dry-run]
description = "chezmoi apply --dry-run --verbose --force (副作用なしの確認)"
run = "chezmoi apply --dry-run --verbose --force"

[tasks.pre-commit]
description = "prek run --all-files (lint / format / shellcheck / hadolint / typos など)"
run = "prek run --all-files"

[tasks.test]
description = "bats -r tests/"
run = "bats -r tests/"

[tasks.encrypt-google-ime]
description = "平文の IME 辞書を編集後に再暗号化する"
run = "chezmoi encrypt settings/common/google.ime.txt > settings/common/encrypted_google.ime.txt.age"

[tasks.decrypt-google-ime]
description = "encrypted_google.ime.txt.age → settings/common/google.ime.txt (平文, gitignore 済み)"
run = "chezmoi decrypt settings/common/encrypted_google.ime.txt.age > settings/common/google.ime.txt"

# 使い方: mise run docker-build <tag> <base-image> <skip_cli_tools> [dockerfile]
# (dockerfile 省略時は docker/Dockerfile.debian)
# GUI ツールはどのバリアントでもインストールしないため SKIP_GUI_TOOLS=true 固定。
# GitHub のレート制限回避のため gh のトークンを BuildKit secret で渡す。
[tasks.docker-build]
description = "Docker イメージ 1 バリアントのビルド (内部レシピ)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="$1"
base_image="$2"
skip_cli_tools="$3"
dockerfile="${4:-docker/Dockerfile.debian}"
GITHUB_TOKEN="$(gh auth token -h github.com)"
export GITHUB_TOKEN
DOCKER_BUILDKIT=1 docker build \
    --secret id=github_token,env=GITHUB_TOKEN \
    -f "$dockerfile" \
    --build-arg "BASE_IMAGE=$base_image" \
    --build-arg "SKIP_CLI_TOOLS=$skip_cli_tools" \
    --build-arg "SKIP_GUI_TOOLS=true" \
    -t "${DOCKER_REPOSITORY:-msageha/dotfiles}:$tag" .
'''

# 引数は docker-build と同じ。マルチアーキ manifest list はローカル docker に
# load できないため --push 一択 (事前に docker login 済みであること)。
# 呼び出し側で buildx ビルダー (mybuilder) を有効化しておくこと (buildx-setup)。
[tasks.docker-build-multi]
description = "Docker イメージ 1 バリアントのマルチアーキビルド + push (内部レシピ)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="$1"
base_image="$2"
skip_cli_tools="$3"
dockerfile="${4:-docker/Dockerfile.debian}"
GITHUB_TOKEN="$(gh auth token -h github.com)"
export GITHUB_TOKEN
docker buildx build -f "$dockerfile" \
    --builder mybuilder \
    --secret id=github_token,env=GITHUB_TOKEN \
    --build-arg "BASE_IMAGE=$base_image" \
    --build-arg "SKIP_CLI_TOOLS=$skip_cli_tools" \
    --build-arg "SKIP_GUI_TOOLS=true" \
    --platform linux/amd64,linux/arm64 \
    --provenance=false \
    --push \
    -t "${DOCKER_REPOSITORY:-msageha/dotfiles}:$tag" .
'''

# ベースイメージ別 / 役割別のビルドマトリクス。
# 役割: -min=CLI ツールも省く最小構成 / 無印=CLI のみ (GUI 省略)
[tasks.build-ubuntu-min]
description = "Ubuntu / 最小 (CLI ツールも省く)"
run = "mise run docker-build ubuntu-min ubuntu:26.04 true"

[tasks.build-ubuntu]
description = "Ubuntu / CLI"
run = "mise run docker-build ubuntu ubuntu:26.04 false"

[tasks.build-debian-min]
description = "Debian / 最小"
run = "mise run docker-build debian-min debian:trixie true"

[tasks.build-debian]
description = "Debian / CLI"
run = "mise run docker-build debian debian:trixie false"

[tasks.build-debian-slim-min]
description = "Debian slim / 最小"
run = "mise run docker-build debian-slim-min debian:trixie-slim true"

[tasks.build-ubuntu-gpu]
description = "Ubuntu + CUDA + CLI (amd64 のみ)"
run = "mise run docker-build ubuntu-gpu nvidia/cuda:13.3.1-base-ubuntu26.04 false"

# Alpine は musl 環境のため最小構成 (skip_cli_tools=true) でビルドする。
[tasks.build-alpine]
description = "Alpine / 最小"
run = "mise run docker-build alpine alpine:3.24 true docker/Dockerfile.alpine"

[tasks.buildx-setup]
description = "buildx ビルダー (mybuilder) の作成・有効化"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if ! docker buildx inspect mybuilder >/dev/null 2>&1; then
    docker buildx create --name mybuilder --use --bootstrap
else
    docker buildx use mybuilder
fi
'''

# GPU は amd64 のみのためマルチアーキ対象外。
[tasks.build-multi-platform]
description = "GPU を除く 6 バリアントのマルチアーキビルド + push"
depends = ["buildx-setup"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run docker-build-multi alpine alpine:3.24 true docker/Dockerfile.alpine
mise run docker-build-multi ubuntu-min ubuntu:26.04 true
mise run docker-build-multi ubuntu ubuntu:26.04 false
mise run docker-build-multi debian-min debian:trixie true
mise run docker-build-multi debian debian:trixie false
mise run docker-build-multi debian-slim-min debian:trixie-slim true
'''

# 途中失敗で即中断する。
[tasks.push]
description = "ビルド済み全タグの docker push"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for tag in alpine ubuntu-min ubuntu debian-min debian debian-slim-min ubuntu-gpu; do
    docker push "${DOCKER_REPOSITORY:-msageha/dotfiles}:$tag"
done
'''
