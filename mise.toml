[tools]
actionlint = "1.7.12"
# renovate: datasource=github-releases depName=FiloSottile/age extractVersion=^v?(?<version>.+)
age = "1.3.2"
bats = "1.14.0"
chezmoi = "2.73.0"
dprint = "0.59.0"
# renovate: datasource=github-releases depName=jdx/fnox extractVersion=^v?(?<version>.+)
fnox = "1.36.0"
hadolint = "2.15.1"
# fnox.toml の 1Password provider (README の bootstrap 手順) と apply-ssh-keys (chezmoi の onepasswordRead) が op を呼び出すためここで pin する。
# renovate: datasource=custom.onepassword-cli depName=1password-cli
op = "2.34.1"
powershell = "7.6.6"
prek = "0.5.4"
shellcheck = "0.11.0"

[hooks]
postinstall = "prek install --hook-type pre-commit --hook-type pre-push"

[settings]
lockfile = true

[tasks.apply]
description = "chezmoi apply --verbose (実際に適用)"
run = "chezmoi apply --verbose"

[tasks.dry-run]
description = "chezmoi apply --dry-run --verbose --force (副作用なしの確認)"
run = "chezmoi apply --dry-run --verbose --force"

[tasks.pre-commit]
description = "prek run --all-files (lint / format / shellcheck / hadolint / typos など)"
run = "prek run --all-files"

# --all-files が無いと prek は未 stage の変更を一時退避して stage 済みの内容だけを検証する (手動実行では作業ツリーをそのまま検証したい)
[tasks.pre-push]
description = "prek run --all-files --hook-stage pre-push (テンプレート描画 dry-run と install スクリプト・Docker バリアント表の bats)"
run = "prek run --all-files --hook-stage pre-push"

[tasks.test]
description = "bats -r tests/"
run = "bats -r tests/"

# 鍵の template は data の apply_ssh_keys が true の実行だけ .chezmoiignore の除外が外れる (README「SSH 秘密鍵」)。
# --less-interactive --error-on-conflict は chezmoi 未管理の既存鍵と内容が違うとき黙って上書きせず exit 1 にする
# (確認後に上書きするなら `mise run apply-ssh-keys -- --force`)。--verbose は秘密鍵を平文で表示するため付けない
[tasks.apply-ssh-keys]
description = "1Password の SSH Key item から秘密鍵と公開鍵を取得して ~/.ssh 配下へ配置する"
run = '''chezmoi apply --override-data '{"apply_ssh_keys": true}' --less-interactive --error-on-conflict ~/.ssh'''

[tasks.encrypt-google-ime]
description = "平文の IME 辞書を編集後に再暗号化する"
run = "chezmoi encrypt settings/common/google.ime.txt > settings/common/encrypted_google.ime.txt.age"

[tasks.decrypt-google-ime]
description = "encrypted_google.ime.txt.age → settings/common/google.ime.txt (平文, gitignore 済み)"
run = "chezmoi decrypt settings/common/encrypted_google.ime.txt.age > settings/common/google.ime.txt"

# 使い方: mise run docker-build <tag> <base-image> <skip_cli_tools> <dockerfile> [--push]
# GUI ツールはどのバリアントでもインストールしないため SKIP_GUI_TOOLS=true 固定。
# GitHub のレート制限回避のため gh のトークンを BuildKit secret で渡す。
# --push はマルチアーキ (amd64/arm64) の manifest list を直接 push する。manifest list はローカル
# docker に load できないため push 一択で、事前に docker login 済みであること。buildx ビルダー
# (mybuilder) は buildx-setup で有効化しておく。
[tasks.docker-build]
description = "Docker イメージ 1 バリアントのビルド (内部レシピ)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="$1"
base_image="$2"
skip_cli_tools="$3"
dockerfile="$4"
image="${DOCKER_REPOSITORY:-msageha/dotfiles}:$tag"
GITHUB_TOKEN="$(gh auth token -h github.com)"
export GITHUB_TOKEN
if [ "${5:-}" = "--push" ]; then
    # GPU は amd64 のみ (CI の matrix も arm64 を exclude)。マルチアーキ push を受け付けない
    if [ "$tag" = ubuntu-gpu ]; then
        echo "$tag is amd64 only and cannot be built multi-arch" >&2
        exit 1
    fi
    docker buildx build -f "$dockerfile" \
        --builder mybuilder \
        --secret id=github_token,env=GITHUB_TOKEN \
        --build-arg "BASE_IMAGE=$base_image" \
        --build-arg "SKIP_CLI_TOOLS=$skip_cli_tools" \
        --build-arg "SKIP_GUI_TOOLS=true" \
        --platform linux/amd64,linux/arm64 \
        --provenance=false \
        --push \
        -t "$image" .
else
    DOCKER_BUILDKIT=1 docker build \
        --secret id=github_token,env=GITHUB_TOKEN \
        -f "$dockerfile" \
        --build-arg "BASE_IMAGE=$base_image" \
        --build-arg "SKIP_CLI_TOOLS=$skip_cli_tools" \
        --build-arg "SKIP_GUI_TOOLS=true" \
        -t "$image" .
fi
'''

# バリアント表 (tag / base image / skip_cli_tools / Dockerfile) の単一ソース。
# CI (docker-image-cd.yaml / docker.yaml) の matrix はこの表を写す。
# 役割: -min=CLI ツールも省く最小構成 / 無印=CLI のみ (GUI 省略)
[tasks.build-ubuntu-min]
description = "Ubuntu / 最小 (CLI ツールも省く)"
run = "mise run docker-build ubuntu-min ubuntu:26.04 true docker/Dockerfile.debian"

[tasks.build-ubuntu]
description = "Ubuntu / CLI"
run = "mise run docker-build ubuntu ubuntu:26.04 false docker/Dockerfile.debian"

[tasks.build-debian-min]
description = "Debian / 最小"
run = "mise run docker-build debian-min debian:trixie true docker/Dockerfile.debian"

[tasks.build-debian]
description = "Debian / CLI"
run = "mise run docker-build debian debian:trixie false docker/Dockerfile.debian"

[tasks.build-debian-slim-min]
description = "Debian slim / 最小"
run = "mise run docker-build debian-slim-min debian:trixie-slim true docker/Dockerfile.debian"

# Alpine は musl 環境のため最小構成 (skip_cli_tools=true) でビルドする。
[tasks.build-alpine]
description = "Alpine / 最小"
run = "mise run docker-build alpine alpine:3.24 true docker/Dockerfile.alpine"

# GPU は amd64 のみのためマルチアーキ (build-multi-platform) の対象外。
[tasks.build-ubuntu-gpu]
description = "Ubuntu + CUDA + CLI (amd64 のみ)"
run = "mise run docker-build ubuntu-gpu nvidia/cuda:13.4.2-base-ubuntu26.04 false docker/Dockerfile.debian"

[tasks.buildx-setup]
description = "buildx ビルダー (mybuilder) の作成・有効化"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if ! docker buildx inspect mybuilder >/dev/null 2>&1; then
    docker buildx create --name mybuilder --use --bootstrap
else
    docker buildx use mybuilder
fi
'''

[tasks.build-multi-platform]
description = "GPU を除く 6 バリアントのマルチアーキビルド + push"
depends = ["buildx-setup"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
for tag in ubuntu-min ubuntu debian-min debian debian-slim-min alpine; do
    mise run "build-$tag" --push
done
'''

[tasks.push]
description = "ビルド済み全タグの docker push"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for tag in ubuntu-min ubuntu debian-min debian debian-slim-min alpine ubuntu-gpu; do
    docker push "${DOCKER_REPOSITORY:-msageha/dotfiles}:$tag"
done
'''
