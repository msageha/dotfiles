[tools]
actionlint = "1.7.12"
# renovate: datasource=github-releases depName=FiloSottile/age extractVersion=^v?(?<version>.+)
age = "1.3.2"
bats = "1.14.0"
chezmoi = "2.74.1"
dprint = "0.65.0"
# renovate: datasource=github-releases depName=jdx/fnox extractVersion=^v?(?<version>.+)
fnox = "1.50.0"
hadolint = "2.15.1"
# fnox.toml の 1Password provider と apply-ssh-keys (chezmoi の onepasswordRead) が op を使う。
# 1Password の配布ページは公開日を返さず minimumReleaseAge の猶予が効かないので、同じ版を公開日付きで出す
# Docker Hub の公式イメージのタグで版を追う
# renovate: datasource=docker depName=1password/op
op = "2.42.0"
powershell = "7.7.0"
prek = "0.5.11"
shellcheck = "0.11.0"

[hooks]
postinstall = "prek install --hook-type pre-commit --hook-type pre-push"

[settings]
lockfile = true

# --all-files が無いと prek は stage 済みの内容だけを検証するので、作業ツリーをそのまま検証するために付ける
[tasks.pre-commit]
description = "commit 時の lint / format を全ファイルに回す"
run = "prek run --all-files"

[tasks.pre-push]
description = "push 時の検査 (全テンプレートの描画、tests/install と tests/docker の bats) を回す"
run = "prek run --all-files --hook-stage pre-push"

[tasks.test]
description = "bats の全テスト (apply 後の $HOME の検査を含む) を回す"
run = "bats -r tests/"

# 鍵の template は apply_ssh_keys が true の実行でだけ .chezmoiignore の除外が外れる。
# --error-on-conflict は既存の鍵と内容が違うとき上書きせず失敗させる (上書きするなら `-- --force`)。
# --verbose は秘密鍵を平文で表示するので付けない。
[tasks.apply-ssh-keys]
description = "1Password の SSH 鍵を ~/.ssh に配置する"
run = '''chezmoi apply --override-data '{"apply_ssh_keys": true}' --less-interactive --error-on-conflict ~/.ssh'''

[tasks.encrypt-google-ime]
description = "編集した平文の IME 辞書を再暗号化する"
run = "chezmoi encrypt settings/common/google.ime.txt > settings/common/encrypted_google.ime.txt.age"

[tasks.decrypt-google-ime]
description = "IME 辞書を平文 (gitignore 済み) に復号する"
run = "chezmoi decrypt settings/common/encrypted_google.ime.txt.age > settings/common/google.ime.txt"

# 使い方: mise run docker-build <tag> <base-image> <skip_cli_tools> <dockerfile>
# gh の token は GitHub API のレート制限を避けるために渡す。
[tasks.docker-build]
description = "Docker イメージを 1 バリアントだけビルドする (build-<tag> から呼ぶ)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="$1"
base_image="$2"
skip_cli_tools="$3"
dockerfile="$4"
GITHUB_TOKEN="$(gh auth token -h github.com)"
export GITHUB_TOKEN
DOCKER_BUILDKIT=1 docker build \
    -f "$dockerfile" \
    --secret id=github_token,env=GITHUB_TOKEN \
    --build-arg "BASE_IMAGE=$base_image" \
    --build-arg "SKIP_CLI_TOOLS=$skip_cli_tools" \
    --build-arg "SKIP_GUI_TOOLS=true" \
    -t "msageha/dotfiles:$tag" \
    .
'''

# バリアント表 (tag / base image / skip_cli_tools / Dockerfile) の単一ソース。
# docker-image-cd.yaml / docker.yaml の matrix はこれを写す。-min と alpine は CLI ツールも省く最小構成、ほかは CLI ツール入り。
[tasks.build-ubuntu-min]
description = "Ubuntu の最小構成のイメージをビルドする"
run = "mise run docker-build ubuntu-min ubuntu:26.04 true docker/Dockerfile.debian"

[tasks.build-ubuntu]
description = "Ubuntu の CLI ツール入りのイメージをビルドする"
run = "mise run docker-build ubuntu ubuntu:26.04 false docker/Dockerfile.debian"

[tasks.build-debian-min]
description = "Debian の最小構成のイメージをビルドする"
run = "mise run docker-build debian-min debian:trixie true docker/Dockerfile.debian"

[tasks.build-debian]
description = "Debian の CLI ツール入りのイメージをビルドする"
run = "mise run docker-build debian debian:trixie false docker/Dockerfile.debian"

[tasks.build-debian-slim-min]
description = "Debian slim の最小構成のイメージをビルドする"
run = "mise run docker-build debian-slim-min debian:trixie-slim true docker/Dockerfile.debian"

# Alpine は musl 環境なので最小構成だけを作る
[tasks.build-alpine]
description = "Alpine の最小構成のイメージをビルドする"
run = "mise run docker-build alpine alpine:3.24 true docker/Dockerfile.alpine"

[tasks.build-ubuntu-gpu]
description = "Ubuntu + CUDA の CLI ツール入りのイメージをビルドする (amd64 のみ)"
run = "mise run docker-build ubuntu-gpu nvidia/cuda:13.5.0-base-ubuntu26.04 false docker/Dockerfile.debian"
