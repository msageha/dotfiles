[files]
# age 暗号化ファイルは base64 暗号文なので typos の誤検出対象外にする。
extend-exclude = ["*.age"]

[default.extend-words]
# "PNGs" (home/dot_claude/skills/pdf/SKILL.md) の PN を typos が ON の typo と判定するため
PN = "PN"
# BetterTouchTool's own misspelled key name
Fom = "Fom"
# eza color code key (user execute for other file kinds) in EZA_COLORS
ue = "ue"
