name: Secret scan

on:
  # pull_request / workflow_dispatch では ci.yaml から reusable workflow として呼ばれる。
  workflow_call:
  # 検知ルールの更新を反映するため、push が無くても main の全履歴を週次で再スキャンする
  schedule:
    - cron: "0 1 * * 1" # 毎週月曜 01:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: gitleaks git --redact -v .
