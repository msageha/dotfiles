name: docker-debian

# ci.yaml から reusable workflow として呼び出される。
# Dockerfile.debian 固有のロジック (ubuntu デフォルトユーザーの削除・locale 生成・useradd 等) は
# chezmoi.yaml の native runner apply では検証されず、docker-image-cd (main push) まで
# 無検証だったため、PR 時点でビルドを通して検証する (docker-alpine.yaml と同型)。
# ubuntu-min は userdel ubuntu の経路、debian-min は素の Debian 経路をカバーする。
# cache scope を docker-image-cd の <tag>-linux-amd64 と揃え、main のビルドキャッシュを
# PR から再利用して所要時間を抑える。
on:
  workflow_call:
    inputs:
      fail-fast:
        description: "失敗時に呼び出し元の run 全体をキャンセルして他の並列チェックを止める"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # fail-fast step (gh run cancel) に必要。呼び出し元でも同じ権限を付与すること
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        variant:
          - tag: ubuntu-min
            base: ubuntu:26.04
          - tag: debian-min
            base: debian:trixie
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.debian
          platforms: linux/amd64
          push: false
          load: true
          tags: dotfiles:${{ matrix.variant.tag }}-ci
          build-args: |
            BASE_IMAGE=${{ matrix.variant.base }}
            SKIP_CLI_TOOLS=true
            SKIP_GUI_TOOLS=true
          provenance: false
          # GitHub のレート制限回避のため token を BuildKit secret で渡す (任意)。
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.tag }}-linux-amd64
      # docker-image-cd の smoke test と同じ条件で起動確認する
      - name: Smoke test image
        run: docker run --rm dotfiles:${{ matrix.variant.tag }}-ci fish -c 'mise --version'
      - name: Cancel the entire run on failure
        if: failure() && inputs.fail-fast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
