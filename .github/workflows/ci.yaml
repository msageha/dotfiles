name: CI

on:
  # push トリガーは置かない。main へ入る変更は PR で検証済みで、main 全履歴の secret scan は
  # gitleaks.yaml の週次 schedule が行う。
  pull_request:
    types: [opened, synchronize, reopened]
  # mise-lock.yaml が GITHUB_TOKEN で push / 作成した PR では CI が自動で走らないため、
  # PR の head ブランチへ dispatch できるようにする
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 各チェックは workflow_call と fail-fast input を持つ reusable workflow として並列に走り、
# 1 つでも失敗したら run 全体をキャンセルする。
# permissions は zizmor (excessive-permissions) に従い job 単位で付ける。actions: write は run のキャンセルに要る。
jobs:
  prek:
    uses: ./.github/workflows/prek.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true

  gitleaks:
    uses: ./.github/workflows/gitleaks.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true

  chezmoi:
    uses: ./.github/workflows/chezmoi.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true

  docker:
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true
