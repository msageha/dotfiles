name: CI

on:
  # push トリガーは置かない。main へ入る変更は PR で検証済みで、main 全履歴の secret scan は
  # gitleaks.yaml の週次 schedule が行う。
  pull_request:
    types: [opened, synchronize, reopened]
  # mise-lock.yaml が GITHUB_TOKEN で push / 作成した PR では CI が自動で走らないので、そのブランチへ dispatch する
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# permissions は zizmor (excessive-permissions) に従い job 単位で付ける。
jobs:
  prek:
    uses: ./.github/workflows/prek.yaml
    permissions:
      contents: read

  gitleaks:
    uses: ./.github/workflows/gitleaks.yaml
    permissions:
      contents: read

  chezmoi:
    uses: ./.github/workflows/chezmoi.yaml
    permissions:
      contents: read

  docker:
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
