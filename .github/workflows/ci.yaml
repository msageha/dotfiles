name: CI

on:
  # push トリガーは置かない: merge 後の main での再実行は PR で検証済みのため不要
  # (secret scan の main 全履歴は gitleaks.yaml の週次 schedule が再スキャンする)。
  # デフォルト types の明示: closed 等 CI が不要な PR イベントでは走らせない
  pull_request:
    types: [opened, synchronize, reopened]
  # mise-lock.yaml が GITHUB_TOKEN で push / 作成する PR には workflow run が自動発火しないため、
  # PR head ブランチへ明示的に dispatch できるようにする
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 各チェックは reusable workflow として並列実行し、1 つでも失敗したら
# その時点で run 全体をキャンセルする (fail-fast)。
# チェックを追加するときはここに job を足し、呼び出される側は
# workflow_call + fail-fast input を持つ reusable workflow として実装する。
# permissions は workflow レベルではなく job レベルで付与する (zizmor excessive-permissions)。
# actions: write は fail-fast (失敗した job が gh run cancel で run 全体を止める) に必要。
jobs:
  prek:
    uses: ./.github/workflows/prek.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true

  gitleaks:
    uses: ./.github/workflows/gitleaks.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true

  chezmoi:
    uses: ./.github/workflows/chezmoi.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true

  docker-alpine:
    uses: ./.github/workflows/docker-alpine.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true

  docker-debian:
    uses: ./.github/workflows/docker-debian.yaml
    permissions:
      contents: read
      actions: write
    with:
      fail-fast: true
