name: chezmoi

# ci.yaml から reusable workflow として呼ばれる (トリガーは ci.yaml が持つ)。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  chezmoi:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml の chezmoi と同じバージョンに揃える。
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.74.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pre-configure chezmoi
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          cat <<EOF > "$HOME/.config/chezmoi/chezmoi.toml"
          [data]
          # macOS の chezmoi init は computer_name を対話で尋ねるため、事前に設定する
          computer_name = "ci-${{ matrix.os }}"
          # GUI 系 (フォント・ghostty・cask) だけを省いて検証する
          skip_cli_tools = false
          skip_gui_tools = true
          EOF
      - name: Initialize chezmoi
        run: chezmoi init --source=${{ github.workspace }}
      - name: Test chezmoi apply (dry-run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }} --dry-run --verbose
      - name: Apply chezmoi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }}
      # mise-action が設定する環境は apply 内の nested mise install (go backend) と干渉するので、apply の後に置く。
      # apply が書いた ~/.config/mise/config.toml は mise.lock に無いツールを含み lockfile の強制で
      # 解決に失敗するので、MISE_CONFIG_DIR を空の場所に向けて repo の mise.toml だけを読ませる。
      - name: Install mise
        uses: ./.github/actions/setup-mise
        env:
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-ci-config
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run bats tests
        env:
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-ci-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ~/.bash_profile は非ゼロを返しうるコマンドを含み、bash -e のままだと PATH 設定の途中で
          # 止まりうるので、source 中だけ -e を外す。
          set +e
          # shellcheck disable=SC1090
          source ~/.bash_profile
          set -e
          mise run test
  chezmoi-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml の chezmoi と同じバージョンに揃える。
      - name: Install chezmoi
        shell: powershell
        run: |
          $chezmoiBin = Join-Path $HOME '.local\bin'
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$chezmoiBin' -t 'v2.74.0'"
          Add-Content -Path $env:GITHUB_PATH -Value $chezmoiBin
      - name: Pre-configure chezmoi
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $HOME '.config\chezmoi') | Out-Null
          @'
          [data]
          # GUI アプリとシステム設定は、各スクリプトが $env:CI を見て CI では skip する
          skip_windows_extras = false
          '@ | Set-Content -Path (Join-Path $HOME '.config\chezmoi\chezmoi.toml') -Encoding utf8
      - name: Initialize chezmoi
        shell: powershell
        run: chezmoi init --source=${{ github.workspace }}
      - name: Test chezmoi apply (dry-run)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }} --dry-run --verbose
      - name: Apply chezmoi
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }}
