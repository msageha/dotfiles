name: chezmoi

# ci.yaml から reusable workflow として呼び出される。
# pull_request / workflow_dispatch のトリガーは ci.yaml 側が持つ。
on:
  workflow_call:
    inputs:
      fail-fast:
        description: "失敗時に呼び出し元の run 全体をキャンセルして他の並列チェックを止める"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # fail-fast step (gh run cancel) に必要。呼び出し元でも同じ権限を付与すること
  # (called workflow の GITHUB_TOKEN は caller の権限を超えられない)
  actions: write

jobs:
  chezmoi:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ローカル (mise.toml) と同一バージョンに -t で pin して導入する。
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.72.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pre-configure chezmoi
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          cat <<EOF > "$HOME/.config/chezmoi/chezmoi.toml"
          [data]
          computer_name = "ci-${{ matrix.os }}"
          # macOS / Linux 共通。CLI ツールとコーディングエージェント設定は CI で検証し、
          # GUI 系 (フォント・ghostty・cask) はスキップする
          skip_cli_tools = false
          skip_gui_tools = true

          [data.github]
          user = "msageha"
          EOF
      - name: Initialize chezmoi
        run: chezmoi init --source=${{ github.workspace }}
      - name: Test chezmoi apply (dry-run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }} --dry-run --verbose
      - name: Apply chezmoi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }}
      # bats は mise.toml の pin + mise.lock の checksum 検証つきで mise 経由で導入・実行する。
      # mise セッション環境は apply 内の nested mise install (go backend) と干渉するため、
      # mise-action は chezmoi apply より後に置く。
      # また apply が書いた user 側 config (~/.config/mise/config.toml) は mise.lock に無い
      # ツールを含み lockfile 強制で解決に失敗するため、MISE_CONFIG_DIR を空の場所へ
      # 退避して repo の mise.toml のみを対象にする。
      # ツール導入の失敗は次ステップのリトライに委ねるため continue-on-error にする
      - name: Install mise
        id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        continue-on-error: true
        with:
          cache: true
        env:
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-ci-config
          GITHUB_TOKEN: ${{ github.token }}
      # aqua backend の attestation 検証が sigstore の TUF (tuf-repo-cdn.sigstore.dev) への
      # 到達性に依存するため、一時的な到達不能でジョブを落とさずリトライする
      # (機序と continue-on-error を選ぶ理由は prek.yaml の同名ステップに記載)。
      - name: Retry mise install
        if: steps.mise.outcome == 'failure'
        env:
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-ci-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked; then
              exit 0
            fi
            echo "::warning::mise install failed (attempt ${attempt}/3)"
            sleep "$((attempt * 10))"
          done
          echo "::error::mise install failed after 3 attempts"
          exit 1
      - name: Run bats tests
        env:
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-ci-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ~/.bash_profile は対話用で、環境によっては非ゼロを返すコマンドを含む。
          # ステップは bash -e で走るため、source をそのまま実行すると PATH 設定
          # 途中で中断しうる。source 中だけ -e を外し、最後まで環境を読み込ませる。
          set +e
          # shellcheck disable=SC1090
          source ~/.bash_profile
          set -e
          mise run test
      # run と各 job の conclusion は cancelled になるが、失敗した step は failure として記録に残る。
      - name: Cancel the entire run on failure
        if: failure() && inputs.fail-fast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
  chezmoi-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # unix job と同様、ローカル (mise.toml) と同一バージョンに -t で pin して導入する
      - name: Install chezmoi
        shell: powershell
        run: |
          $chezmoiBin = Join-Path $HOME '.local\bin'
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$chezmoiBin' -t 'v2.72.0'"
          Add-Content -Path $env:GITHUB_PATH -Value $chezmoiBin
      - name: Pre-configure chezmoi
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $HOME '.config\chezmoi') | Out-Null
          @'
          [data]
          # インストールとエージェント設定の展開まで CI で検証する。
          # GUI アプリ導入とシステム設定は各スクリプトの $env:CI ガードが CI でのみスキップする
          skip_windows_extras = false

          [data.github]
          user = "msageha"
          '@ | Set-Content -Path (Join-Path $HOME '.config\chezmoi\chezmoi.toml') -Encoding utf8
      - name: Initialize chezmoi
        shell: powershell
        run: chezmoi init --source=${{ github.workspace }}
      - name: Test chezmoi apply (dry-run)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }} --dry-run --verbose
      - name: Apply chezmoi
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chezmoi apply --source=${{ github.workspace }}
      - name: Cancel the entire run on failure
        if: failure() && inputs.fail-fast
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY"
