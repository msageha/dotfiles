name: mise lock

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC
  pull_request:
    branches:
      - main
    paths:
      - mise.toml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # 更新したブランチで ci.yaml を workflow_dispatch するため
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mise-lock:
    # fork からの PR は head ref が base リポジトリに無く、GITHUB_TOKEN で push もできないため skip する。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # push は後の step で token を明示して行うため、checkout に認証情報を残さない
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      # 古い mise.lock のままツールを導入すると checksum 不一致で失敗しうるので、mise 本体だけを入れる。
      - name: Install mise
        uses: ./.github/actions/setup-mise
        with:
          install: "false"

      # バージョンの更新は Renovate が行う。ここでは pin のまま mise.lock の checksum / URL だけを再生成する。
      - name: Run mise lock
        env:
          # runner の共有 IP での無認証 rate limit (60 req/h) を避ける
          GITHUB_TOKEN: ${{ github.token }}
        run: mise lock

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mise.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git author
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # mise.toml を変えた PR (Renovate 等) には、同じブランチへ mise.lock を commit する。
      - name: Push mise.lock update to the pull request branch
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add mise.lock
          git commit -m "chore: update mise.lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$HEAD_REF"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -B chore/mise-lock
          git add mise.lock
          git commit -m "chore: update mise.lock"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" chore/mise-lock

          if ! gh pr view chore/mise-lock --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --title "chore: update mise.lock" --base main --head chore/mise-lock \
              --body "mise lock の自動実行による mise.lock の更新です。差分を確認してください。"
          fi

      # GITHUB_TOKEN による push / PR 作成では workflow が発火しない (GitHub の再帰防止)。
      # workflow_dispatch はその例外なので、更新したブランチで ci.yaml を起動して required check を付ける。
      - name: Dispatch CI workflows for the updated branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'chore/mise-lock' }}
        run: gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"
