name: prek

# ci.yaml から reusable workflow として呼ばれる (トリガーは ci.yaml が持つ)。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GITHUB_TOKEN は GitHub API を呼ぶ step (aqua / ubi backend の rate limit 回避) にだけ渡す。
      - name: Install mise
        uses: ./.github/actions/setup-mise
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run prek
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run pre-commit
