name: prek

# ci.yaml から reusable workflow として呼ばれる (トリガーは ci.yaml が持つ)。
on:
  workflow_call:
    inputs:
      fail-fast:
        description: "失敗したら呼び出し元の run 全体をキャンセルし、並列の他チェックを止める"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # fail-fast の run キャンセルに要る。called workflow の GITHUB_TOKEN は caller の権限を
  # 超えられないので、ci.yaml の job にも同じ権限を付ける。
  actions: write

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GITHUB_TOKEN は GitHub API を呼ぶ step (aqua / ubi backend の rate limit 回避) にだけ渡す。
      - name: Install mise
        uses: ./.github/actions/setup-mise
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run prek
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run pre-commit

      # run と各 job の conclusion は cancelled になるが、失敗した step は failure として記録に残る。
      - name: Cancel the entire run on failure
        if: failure() && inputs.fail-fast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
