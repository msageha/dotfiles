name: prek

# ci.yaml から reusable workflow として呼び出される。
# pull_request / workflow_dispatch のトリガーは ci.yaml 側が持つ。
on:
  workflow_call:
    inputs:
      fail-fast:
        description: "失敗時に呼び出し元の run 全体をキャンセルして他の並列チェックを止める"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # fail-fast step (gh run cancel) に必要。呼び出し元でも同じ権限を付与すること
  # (called workflow の GITHUB_TOKEN は caller の権限を超えられない)
  actions: write

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GITHUB_TOKEN は GitHub API を叩くステップ (ubi/aqua backend の rate limit 回避)
      # だけに step-level で渡し、workflow レベルで全ステップへ露出させない。
      # ツール導入の失敗は次ステップのリトライに委ねるため continue-on-error にする
      # (mise-action は install を自分で行ったときだけ cache を保存するので、
      #  install: false にはせず cache を温存する)。
      - name: Install mise
        id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        continue-on-error: true
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # aqua backend の artifact attestation 検証は、GitHub の Immutable Releases が付ける
      # attestation (certificate identity: dotcom.releases.github.com) が aqua registry の
      # signer_workflow と一致せず、常に 2 つ目の sigstore 署名 attestation へフォールバック
      # する。その検証は tuf-repo-cdn.sigstore.dev への到達性に依存し、mise の http_retries は
      # attestation API にしか効かず TUF 取得には及ばない。mise 本体と PATH は前ステップで
      # 設定済みなので、ここではツール導入だけをやり直す。
      - name: Retry mise install
        if: steps.mise.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked; then
              exit 0
            fi
            echo "::warning::mise install failed (attempt ${attempt}/3)"
            sleep "$((attempt * 10))"
          done
          echo "::error::mise install failed after 3 attempts"
          exit 1

      - name: Run prek
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run pre-commit

      # run と各 job の conclusion は cancelled になるが、失敗した step は failure として記録に残る。
      - name: Cancel the entire run on failure
        if: failure() && inputs.fail-fast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
