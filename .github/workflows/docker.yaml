name: docker

# ci.yaml から reusable workflow として呼ばれる (トリガーは ci.yaml が持つ)。
# Dockerfile は他の CI では検証されないので、PR の時点でビルドする。ubuntu-min は既存の ubuntu
# ユーザーを消す経路、debian-min は素の Debian の経路、alpine は Dockerfile.alpine を通す。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # check 名に base image の tag を含めない (Renovate の更新で check 名が変わらないように)
    name: build (${{ matrix.variant.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        variant:
          - tag: ubuntu-min
            base: ubuntu:26.04
            file: docker/Dockerfile.debian
          - tag: debian-min
            base: debian:trixie
            file: docker/Dockerfile.debian
          - tag: alpine
            base: alpine:3.24
            file: docker/Dockerfile.alpine
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: dotfiles:${{ matrix.variant.tag }}-ci
          build-args: |
            BASE_IMAGE=${{ matrix.variant.base }}
            SKIP_CLI_TOOLS=true
            SKIP_GUI_TOOLS=true
          provenance: false
          # GitHub API のレート制限を避けるため token を BuildKit secret で渡す (無くてもビルドできる)。
          secrets: |
            github_token=${{ github.token }}
          # scope を docker-image-cd の <tag>-linux-amd64 と揃え、main のビルドキャッシュを再利用する
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.tag }}-linux-amd64
      # docker-image-cd の smoke test と同じ確認
      - name: Smoke test image
        run: docker run --rm dotfiles:${{ matrix.variant.tag }}-ci fish -c 'mise --version'
