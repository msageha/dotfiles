name: Docker Image Continuous Deployment (CD)
on:
  # main へは required checks (ci.yaml) を通った PR しか merge できないので、push 時点で CI は通過済み。
  push:
    branches: [main]
  workflow_dispatch:
env:
  IMAGE: msageha/dotfiles
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # mise.toml の build-<tag> タスクのバリアント表と一致させる。
        # GPU は arm64 が無いため exclude で除く。
        variant:
          - tag: ubuntu-min
            base: ubuntu:26.04
            skip_cli_tools: "true"
            file: docker/Dockerfile.debian
          - tag: ubuntu
            base: ubuntu:26.04
            skip_cli_tools: "false"
            file: docker/Dockerfile.debian
          - tag: debian-min
            base: debian:trixie
            skip_cli_tools: "true"
            file: docker/Dockerfile.debian
          - tag: debian
            base: debian:trixie
            skip_cli_tools: "false"
            file: docker/Dockerfile.debian
          - tag: debian-slim-min
            base: debian:trixie-slim
            skip_cli_tools: "true"
            file: docker/Dockerfile.debian
          - tag: alpine
            base: alpine:3.24
            skip_cli_tools: "true"
            file: docker/Dockerfile.alpine
          - tag: ubuntu-gpu
            base: nvidia/cuda:13.4.3-base-ubuntu26.04
            skip_cli_tools: "false"
            file: docker/Dockerfile.debian
        platform:
          - os: linux/amd64
            runner: ubuntu-latest
          - os: linux/arm64
            runner: ubuntu-26.04-arm
        # matrix の値がオブジェクトなので、exclude ではエントリ全体を一致させる。
        exclude:
          - variant:
              tag: ubuntu-gpu
              base: nvidia/cuda:13.4.3-base-ubuntu26.04
              skip_cli_tools: "false"
              file: docker/Dockerfile.debian
            platform:
              os: linux/arm64
              runner: ubuntu-26.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform.os }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant.file }}
          platforms: ${{ matrix.platform.os }}
          build-args: |
            BASE_IMAGE=${{ matrix.variant.base }}
            SKIP_CLI_TOOLS=${{ matrix.variant.skip_cli_tools }}
            SKIP_GUI_TOOLS=true
          provenance: false
          # GitHub API のレート制限を避けるため token を BuildKit secret で渡す (無くてもビルドできる)。
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.tag }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      # merge job で tag を付ける前に起動を確かめる。fish -c は config.fish を読むので、
      # シェル設定や mise の PATH が壊れたイメージを公開前に検出できる。
      - name: Smoke test image
        # outputs は run に直接展開せず env で渡す (zizmor template-injection)
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm "${IMAGE}@${BUILD_DIGEST}" fish -c 'mise --version'
      - name: Export digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${BUILD_DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # PLATFORM_PAIR は linux- で始まるので、merge 側の "digests-<tag>-linux-*" が
          # ubuntu と ubuntu-min のような接頭辞の重なりを取り違えない。
          name: digests-${{ matrix.variant.tag }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        tag:
          - ubuntu-min
          - ubuntu
          - debian-min
          - debian
          - debian-slim-min
          - alpine
          - ubuntu-gpu
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.tag }}-linux-*
          merge-multiple: true
      - name: Log in to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:${{ matrix.tag }}" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ matrix.tag }}"
