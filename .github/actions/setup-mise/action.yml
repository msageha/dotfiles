name: Setup mise
description: mise 本体と mise.toml のツールを導入する (ツール導入はリトライつき)

# GITHUB_TOKEN / MISE_CONFIG_DIR 等は呼び出し側 step の env で渡す (composite の各 step に引き継がれる)。
inputs:
  install:
    description: "mise.toml のツールを導入するか (false なら mise 本体のみ)"
    required: false
    default: "true"
  version:
    description: "導入する mise のバージョン"
    required: false
    # "latest" は上流の release 直後に asset が未アップロードで 404 になりうるので、固定して Renovate で更新する。
    default: "2026.11.4"

runs:
  using: composite
  steps:
    # ツール導入の失敗は次の step のリトライに任せる。mise-action は自分で install したときだけ cache を
    # 保存するので、install: false にはしない。mise 本体だけを入れるときはリトライが無いので失敗させる。
    - name: Install mise
      id: mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      continue-on-error: ${{ inputs.install == 'true' }}
      with:
        version: ${{ inputs.version }}
        install: ${{ inputs.install }}
        cache: ${{ inputs.install == 'true' }}

    # aqua backend は、Immutable Releases の attestation が aqua registry の signer_workflow と一致しないと
    # sigstore 署名の検証に回り、tuf-repo-cdn.sigstore.dev への接続で失敗しうる。mise の http_retries は
    # この取得に効かないので、ツール導入だけをやり直す (mise 本体と PATH は前の step で設定済み)。
    - name: Retry mise install
      if: inputs.install == 'true' && steps.mise.outcome == 'failure'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if mise install --locked; then
            exit 0
          fi
          echo "::warning::mise install failed (attempt ${attempt}/3)"
          sleep "$((attempt * 10))"
        done
        echo "::error::mise install failed after 3 attempts"
        exit 1
